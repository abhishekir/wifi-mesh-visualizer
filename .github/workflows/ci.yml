name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    # Pinned: setup-python has no 3.9 build for Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The oldest interpreter the server runs under: macOS's bundled python3.
          python-version: "3.9"
      - run: python -m py_compile server.py
      # test_server.py stubs CoreWLAN, which only exists on macOS.
      - run: pip install "websockets>=12.0"
      - run: python -m unittest test_server
      - run: bash -n start.sh
